<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEARNORA | Admin + Student Portal</title>
<style>
:root{--bg:#f4f6fb;--panel:#fff;--ink:#182238;--muted:#718096;--brand:#5146e5;--brand2:#776cf6;--line:#e7eaf2;--green:#16865b;--red:#d94b59;--shadow:0 12px 35px rgba(29,40,75,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:11px;padding:11px 15px;background:var(--brand);color:white;font-weight:700}button:hover{filter:brightness(1.06)}button.secondary{background:#eef0ff;color:var(--brand)}button.danger{background:#fff0f1;color:var(--red)}.hidden{display:none!important}.wrap{max-width:1200px;margin:auto;padding:24px}.brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:1.5px;font-size:22px}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#5146e5,#a59cff);display:grid;place-items:center;color:white;font-weight:900}.sub{font-size:11px;color:var(--muted);letter-spacing:2px;margin-top:2px}.login-shell{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 15% 10%,#e7e5ff,transparent 32%),radial-gradient(circle at 90% 85%,#dff7f0,transparent 30%),var(--bg)}.login-card{width:min(460px,100%);background:white;padding:34px;border-radius:24px;box-shadow:var(--shadow)}.login-card h1{margin:28px 0 6px;font-size:28px}.muted{color:var(--muted)}.field{display:grid;gap:7px;margin:16px 0}.field label{font-size:13px;font-weight:700}.field input,.field select,.field textarea{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:11px;background:#fbfcff;outline:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--brand)}.full{width:100%}.hint{font-size:12px;background:#f4f3ff;padding:12px;border-radius:10px;color:#5146a5;line-height:1.6;margin-top:15px}.topbar{background:white;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.topinner{max-width:1200px;margin:auto;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px}.userbox{display:flex;align-items:center;gap:12px}.avatar{width:38px;height:38px;border-radius:50%;background:#eeedff;color:var(--brand);display:grid;place-items:center;font-weight:800}.layout{display:grid;grid-template-columns:230px 1fr;gap:22px;margin-top:22px}.side,.content-card,.stat{background:white;border:1px solid var(--line);border-radius:18px;box-shadow:0 4px 18px rgba(30,40,80,.03)}.side{padding:14px;height:max-content;position:sticky;top:88px}.nav{width:100%;display:flex;gap:11px;align-items:center;text-align:left;background:transparent;color:#59657a;margin:3px 0}.nav.active{background:#f0efff;color:var(--brand)}.main h1{margin:0 0 5px;font-size:27px}.mainhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.stat{padding:18px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:27px;margin-top:8px}.content-card{padding:20px;margin-bottom:18px}.content-card h3{margin:0 0 16px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:520px}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted);font-weight:700}.pill{display:inline-block;border-radius:30px;padding:5px 9px;font-size:11px;font-weight:800;background:#e8f7ef;color:var(--green)}.pill.pending{background:#fff4df;color:#a36b00}.resource{border:1px solid var(--line);border-radius:13px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;margin:9px 0}.resource p{margin:5px 0 0;color:var(--muted);font-size:12px}.notice{border-left:3px solid var(--brand);background:#f7f7ff;padding:13px 15px;border-radius:9px;margin:10px 0}.empty{color:var(--muted);padding:20px;text-align:center}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#182238;color:white;padding:12px 18px;border-radius:12px;z-index:20;box-shadow:var(--shadow)}.small{font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.section{display:none}.section.active{display:block}.student-welcome{background:linear-gradient(120deg,#5146e5,#847bfa);color:white;border-radius:18px;padding:24px;margin-bottom:18px}.student-welcome p{opacity:.85;margin-bottom:0}@media(max-width:850px){.layout{grid-template-columns:1fr}.side{position:static;display:flex;overflow:auto;gap:5px}.nav{white-space:nowrap;width:auto}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:540px){.wrap{padding:14px}.topinner{padding:12px 14px}.stats,.grid2{grid-template-columns:1fr 1fr}.stat{padding:13px}.stat strong{font-size:22px}.mainhead{align-items:flex-start;flex-direction:column}.login-card{padding:24px}.side{padding:8px}.nav{font-size:12px;padding:9px}}
</style>
</head>
<body>
<div id="loginScreen" class="login-shell">
  <div class="login-card">
    <div class="brand"><div class="logo">L</div><div>LEARNORA<div class="sub">EXCLUSIVE MASTER STUDY</div></div></div>
    <h1>Welcome back</h1><div class="muted">Sign in to your learning space.</div>
    <div class="field"><label for="username">Username</label><input id="username" placeholder="Enter username" autocomplete="username"></div>
    <div class="field"><label for="password">Password</label><input id="password" type="password" placeholder="Enter password" autocomplete="current-password"></div>
    <button class="full" onclick="login()">Sign in to portal →</button>
    <div class="hint"><b>Demo access</b><br>Admin: <b>admin</b> / <b>learnora123</b><br>Student: <b>student01</b> / <b>learnora123</b><br><span class="small">Demo only. Change these before any real use.</span></div>
  </div>
</div>
<div id="app" class="hidden">
  <header class="topbar"><div class="topinner"><div class="brand"><div class="logo">L</div><div>LEARNORA<div class="sub">EXCLUSIVE MASTER STUDY</div></div></div><div class="userbox"><div><b id="userName">User</b><div class="muted small" id="userRole">Portal</div></div><div class="avatar" id="userAvatar">U</div><button class="secondary" onclick="logout()">Logout</button></div></div></header>
  <div class="wrap layout">
    <aside class="side" id="sidebar"></aside>
    <main class="main" id="mainContent"></main>
  </div>
</div>
<div id="toast" class="toast hidden"></div>
<script>
const KEY='learnora_portal_demo_v1';
const initial={students:[{id:'LRN001',name:'Demo Student',className:'10',username:'student01',password:'learnora123'}],materials:[],notices:[{id:1,title:'Welcome to LEARNORA',body:'Your learning journey starts here.'}],results:[]};
let data=loadData(),current=null,active='dashboard';
function loadData(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(initial)}catch(e){return JSON.parse(JSON.stringify(initial))}}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2400)}
function login(){let u=document.getElementById('username').value.trim(),p=document.getElementById('password').value; if(u==='admin'&&p==='learnora123'){current={role:'admin',name:'Administrator'}}else{let s=data.students.find(x=>x.username===u&&x.password===p);if(s&&p===s.password){current={role:'student',name:s.name,id:s.id,className:s.className}}else{toast('Invalid username or password');return}}document.getElementById('loginScreen').classList.add('hidden');document.getElementById('app').classList.remove('hidden');render()}
function logout(){current=null;document.getElementById('app').classList.add('hidden');document.getElementById('loginScreen').classList.remove('hidden');document.getElementById('password').value=''}
function menu(){return current.role==='admin'?[['dashboard','▦','Overview'],['students','♙','Students'],['materials','▤','Study Materials'],['notices','◉','Notices'],['results','✓','Results']]:[['dashboard','▦','Dashboard'],['materials','▤','Study Materials'],['notices','◉','Notices'],['results','✓','My Results']]}
function go(s){active=s;render()}
function render(){document.getElementById('userName').textContent=current.name;document.getElementById('userRole').textContent=current.role==='admin'?'Administrator':'Student • Class '+current.className;document.getElementById('userAvatar').textContent=current.name[0].toUpperCase();document.getElementById('sidebar').innerHTML=menu().map(([id,ic,label])=>`<button class="nav ${active===id?'active':''}" onclick="go('${id}')"><span>${ic}</span>${label}</button>`).join('');let title=menu().find(x=>x[0]===active)?.[2]||'Dashboard';document.getElementById('mainContent').innerHTML=`<div class="mainhead"><div><h1>${title}</h1><div class="muted small">LEARNORA • WBBSE • Classes 5–10</div></div>${current.role==='admin'?'<span class="pill">ADMIN ACCESS</span>':'<span class="pill">STUDENT PORTAL</span>'}</div>${view()}`}
function view(){if(active==='dashboard')return current.role==='admin'?adminDash():studentDash();if(active==='students')return studentsView();if(active==='materials')return materialsView();if(active==='notices')return noticesView();if(active==='results')return resultsView();return ''}
function adminDash(){return `<div class="stats"><div class="stat"><small>Total students</small><strong>${data.students.length}</strong></div><div class="stat"><small>Study materials</small><strong>${data.materials.length}</strong></div><div class="stat"><small>Notices</small><strong>${data.notices.length}</strong></div><div class="stat"><small>Results</small><strong>${data.results.length}</strong></div></div><div class="content-card"><h3>Welcome, Administrator</h3><p class="muted">Manage students, publish study materials, share notices and enter results from one place.</p><div class="actions"><button onclick="go('students')">Manage students</button><button class="secondary" onclick="go('materials')">Upload material</button><button class="secondary" onclick="go('notices')">Post notice</button></div></div><div class="content-card"><h3>Platform information</h3><p class="muted">Founder: <b>PRANIT PANDA</b> · Teaching: Offline + Online</p></div>`}
function studentDash(){return `<div class="student-welcome"><h2>Hello, ${esc(current.name)} 👋</h2><p>Welcome to your LEARNORA learning dashboard. Keep learning, one lesson at a time.</p></div><div class="stats"><div class="stat"><small>Your class</small><strong>${esc(current.className)}</strong></div><div class="stat"><small>Materials</small><strong>${data.materials.filter(m=>m.className==='All'||m.className===current.className).length}</strong></div><div class="stat"><small>Notices</small><strong>${data.notices.length}</strong></div><div class="stat"><small>Results</small><strong>${data.results.filter(r=>r.studentId===current.id).length}</strong></div></div><div class="content-card"><h3>Quick access</h3><div class="actions"><button onclick="go('materials')">Open study materials</button><button class="secondary" onclick="go('results')">View results</button></div></div>`}
function studentsView(){if(current.role!=='admin')return '';return `<div class="content-card"><h3>Add new student</h3><div class="grid2"><div class="field"><label>Student name</label><input id="sName" placeholder="Full name"></div><div class="field"><label>Class</label><select id="sClass">${[5,6,7,8,9,10].map(n=>`<option>${n}</option>`).join('')}</select></div><div class="field"><label>Username</label><input id="sUser" placeholder="Unique username"></div><div class="field"><label>Temporary password</label><input id="sPass" placeholder="Create password"></div></div><button onclick="addStudent()">Add student</button></div><div class="content-card"><h3>Student list</h3><div class="tablewrap"><table><thead><tr><th>ID</th><th>Name</th><th>Class</th><th>Username</th><th></th></tr></thead><tbody>${data.students.map(s=>`<tr><td>${esc(s.id)}</td><td>${esc(s.name)}</td><td>${esc(s.className)}</td><td>${esc(s.username)}</td><td><button class="danger" onclick="deleteStudent('${s.id}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="5">No students yet.</td></tr>'}</tbody></table></div></div>`}
function addStudent(){let name=val('sName'),className=val('sClass'),username=val('sUser'),password=val('sPass');if(!name||!username||!password)return toast('Please complete all fields');if(data.students.some(s=>s.username===username)||username==='admin')return toast('Username already exists');data.students.push({id:'LRN'+String(Date.now()).slice(-6),name,className,username,password});save();render();toast('Student added')}
function deleteStudent(id){if(!confirm('Delete this student?'))return;data.students=data.students.filter(s=>s.id!==id);data.results=data.results.filter(r=>r.studentId!==id);save();render();toast('Student deleted')}
function materialsView(){let list=data.materials.filter(m=>current.role==='admin'||m.className==='All'||m.className===current.className);return `${current.role==='admin'?`<div class="content-card"><h3>Publish study material</h3><div class="grid2"><div class="field"><label>Title</label><input id="mTitle" placeholder="e.g. Light - Chapter Notes"></div><div class="field"><label>Class</label><select id="mClass"><option>All</option>${[5,6,7,8,9,10].map(n=>`<option>${n}</option>`).join('')}</select></div></div><div class="field"><label>Resource link (Google Drive / YouTube / PDF URL)</label><input id="mUrl" placeholder="https://..."></div><div class="field"><label>Type</label><select id="mType"><option>Notes</option><option>Video lesson</option><option>Practice paper</option><option>Other</option></select></div><button onclick="addMaterial()">Publish material</button><p class="muted small">Upload your file to a trusted file host first, then paste its share link here.</p></div>`:''}<div class="content-card"><h3>${current.role==='admin'?'Published materials':'Materials for your class'}</h3>${list.map(m=>`<div class="resource"><div><b>${esc(m.title)}</b><p>Class ${esc(m.className)} · ${esc(m.type)}</p></div><div class="actions"><button class="secondary" onclick="openLink('${encodeURIComponent(m.url)}')">Open</button>${current.role==='admin'?`<button class="danger" onclick="deleteMaterial(${m.id})">Delete</button>`:''}</div></div>`).join('')||'<div class="empty">No materials published yet.</div>'}</div>`}
function addMaterial(){let title=val('mTitle'),className=val('mClass'),url=val('mUrl'),type=val('mType');if(!title||!url)return toast('Enter a title and resource link');if(!/^https?:\/\//i.test(url))return toast('Please enter a valid link starting with https://');data.materials.unshift({id:Date.now(),title,className,url,type});save();render();toast('Material published')}
function deleteMaterial(id){data.materials=data.materials.filter(m=>m.id!==id);save();render();toast('Material deleted')}
function noticesView(){return `${current.role==='admin'?`<div class="content-card"><h3>Publish notice</h3><div class="field"><label>Notice title</label><input id="nTitle" placeholder="Notice heading"></div><div class="field"><label>Message</label><textarea id="nBody" rows="3" placeholder="Write your notice..."></textarea></div><button onclick="addNotice()">Publish notice</button></div>`:''}<div class="content-card"><h3>Latest notices</h3>${data.notices.map(n=>`<div class="notice"><b>${esc(n.title)}</b><p>${esc(n.body)}</p>${current.role==='admin'?`<button class="danger" onclick="deleteNotice(${n.id})">Delete</button>`:''}</div>`).join('')||'<div class="empty">No notices yet.</div>'}</div>`}
function addNotice(){let title=val('nTitle'),body=val('nBody');if(!title||!body)return toast('Enter notice title and message');data.notices.unshift({id:Date.now(),title,body});save();render();toast('Notice published')}
function deleteNotice(id){data.notices=data.notices.filter(n=>n.id!==id);save();render()}
function resultsView(){if(current.role==='admin')return `<div class="content-card"><h3>Add student result</h3><div class="grid2"><div class="field"><label>Student</label><select id="rStudent">${data.students.map(s=>`<option value="${s.id}">${esc(s.name)} (${esc(s.id)})</option>`).join('')}</select></div><div class="field"><label>Exam / subject</label><input id="rExam" placeholder="e.g. Unit Test - Mathematics"></div><div class="field"><label>Marks obtained</label><input id="rMarks" type="number" min="0" placeholder="80"></div><div class="field"><label>Maximum marks</label><input id="rMax" type="number" min="1" placeholder="100"></div></div><button onclick="addResult()">Save result</button></div><div class="content-card"><h3>All results</h3>${resultTable(data.results,true)}</div>`;let own=data.results.filter(r=>r.studentId===current.id);return `<div class="content-card"><h3>My academic results</h3>${resultTable(own,false)}</div>`}
function resultTable(rows,admin){if(!rows.length)return '<div class="empty">No results available yet.</div>';return `<div class="tablewrap"><table><thead><tr>${admin?'<th>Student ID</th>':''}<th>Exam / Subject</th><th>Marks</th><th>Percentage</th>${admin?'<th></th>':''}</tr></thead><tbody>${rows.map(r=>`<tr>${admin?`<td>${esc(r.studentId)}</td>`:''}<td>${esc(r.exam)}</td><td>${r.marks}/${r.max}</td><td>${(r.marks/r.max*100).toFixed(1)}%</td>${admin?`<td><button class="danger" onclick="deleteResult(${r.id})">Delete</button></td>`:''}</tr>`).join('')}</tbody></table></div>`}
function addResult(){let studentId=val('rStudent'),exam=val('rExam'),marks=Number(val('rMarks')),max=Number(val('rMax'));if(!studentId||!exam||!Number.isFinite(marks)||!Number.isFinite(max)||max<=0||marks<0||marks>max)return toast('Check the result details');data.results.unshift({id:Date.now(),studentId,exam,marks,max});save();render();toast('Result saved')}
function deleteResult(id){data.results=data.results.filter(r=>r.id!==id);save();render()}
function val(id){return document.getElementById(id)?.value.trim()||''}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openLink(u){let url=decodeURIComponent(u);if(/^https?:\/\//i.test(url))window.open(url,'_blank','noopener,noreferrer')}
</script>
</body>
</html>
